name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
      - linux-rhel-ubuntu-debian
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/linux-rhel-ubuntu-debian' }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hlstools:test

      - name: Validate Apple HLS reference stream
        env:
          IMAGE: hlstools:test
          VALIDATION_SECONDS: "20"
        run: ./tests/validate-apple-reference-stream.sh

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-hls-reference-validation
          path: tests/results/
          if-no-files-found: error
          retention-days: 14

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
